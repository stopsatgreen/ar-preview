<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AR Preview</title>

    <meta name="description" content="A fast and simple AR preview built with Model Viewer." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="AR Preview" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="A fast and simple AR preview built with Model Viewer." />

    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </head>
  <body>
    <model-viewer alt="3D Model"
      src="assets/rodin-faith-girl-2-draco.glb"
      ar ar-modes="scene-viewer quick-look webxr"
      shadow-intensity="1"
      camera-controls enable-pan>
    </model-viewer>
  </body>
</html>
